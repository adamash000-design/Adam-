<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style>
<title>מילים להכתבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Patrick+Hand&family=Secular+One&display=swap" rel="stylesheet">
<style>
  /* Layout: ruled school notebook, red margin line on the reading side, index cards with ink outlines. Skins swap the whole token set. */
  :root {
    --paper: #fbfaf4;
    --ink: #17254b;
    --ink-soft: #55628a;
    --rule: #cfdcf2;
    --margin: #e58a93;
    --card: #ffffff;
    --hi: #ffe066;
    --hi-ink: #17254b;
    --good: #1c7f54;
    --good-bg: #d8f2e5;
    --bad: #b8352f;
    --bad-bg: #fbe0dd;
    --accent: #2f5fd0;
    --accent-ink: #ffffff;
    --display: 'Secular One', 'Heebo', 'Arial Hebrew', sans-serif;
    --ui: 'Heebo', 'Arial Hebrew', system-ui, sans-serif;
    --hand: 'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161b2b; --ink: #e8ecfa; --ink-soft: #9aa6c7; --rule: #26314f; --margin: #a64b55;
      --card: #212843; --hi: #e6bd35; --hi-ink: #17254b; --good: #55d19a; --good-bg: #17382c;
      --bad: #ff8a80; --bad-bg: #432224; --accent: #7ea2ff; --accent-ink: #0f1730;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #161b2b; --ink: #e8ecfa; --ink-soft: #9aa6c7; --rule: #26314f; --margin: #a64b55;
    --card: #212843; --hi: #e6bd35; --hi-ink: #17254b; --good: #55d19a; --good-bg: #17382c;
    --bad: #ff8a80; --bad-bg: #432224; --accent: #7ea2ff; --accent-ink: #0f1730;
    color-scheme: dark;
  }
  /* Skins chosen in Settings. Each one sets every token, so the viewer's own theme does not mix in. */
  html:root[data-skin="night"] {
    --paper: #0f1226; --ink: #eef0ff; --ink-soft: #a4abd6; --rule: #1f2449; --margin: #7b4fd6;
    --card: #181c38; --hi: #ffcf4a; --hi-ink: #1a1530; --good: #5ee0a0; --good-bg: #123a2c;
    --bad: #ff8f8f; --bad-bg: #3d1d28; --accent: #8aa0ff; --accent-ink: #0e1230; color-scheme: dark;
  }
  html:root[data-skin="sea"] {
    --paper: #eef8f8; --ink: #0b3b44; --ink-soft: #4a7780; --rule: #c9e6e8; --margin: #f29b8b;
    --card: #ffffff; --hi: #ffb4a2; --hi-ink: #0b3b44; --good: #1c7f54; --good-bg: #d5f2e3;
    --bad: #b8352f; --bad-bg: #fbe0dd; --accent: #0d7f8f; --accent-ink: #ffffff; color-scheme: light;
  }
  html:root[data-skin="candy"] {
    --paper: #fff5fa; --ink: #3b1d5a; --ink-soft: #7b5c98; --rule: #f5d6ea; --margin: #c58be0;
    --card: #ffffff; --hi: #9be8c8; --hi-ink: #20103a; --good: #197a52; --good-bg: #d6f3e6;
    --bad: #c0392b; --bad-bg: #fde0dc; --accent: #a8309a; --accent-ink: #ffffff; color-scheme: light;
  }
  html:root[data-skin="forest"] {
    --paper: #f1f5ea; --ink: #1f3a26; --ink-soft: #587560; --rule: #d6e3cc; --margin: #d9a441;
    --card: #fffef8; --hi: #f4b95a; --hi-ink: #2a2410; --good: #1c7f54; --good-bg: #dcefd5;
    --bad: #b8352f; --bad-bg: #fbe0dd; --accent: #2b7a43; --accent-ink: #ffffff; color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 17px;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: ''; position: fixed; inset-block: 0; inset-inline-start: 9px; width: 2px; background: var(--margin); opacity: .8; pointer-events: none;
  }
  .wrap { max-width: 720px; margin-inline: auto; padding-block: 18px 48px; padding-inline: 24px 18px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .tools { display: flex; align-items: center; gap: 10px; }
  .brand { font-family: var(--display); font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
  .xp { font-weight: 800; background: var(--hi); color: var(--hi-ink); padding: 4px 12px; border: 2px solid var(--ink); border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hbtn { width: 44px; height: 44px; display: grid; place-items: center; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--ink); padding: 0; }
  .hbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .hbtn svg, .tag svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hbtn svg { width: 24px; height: 24px; }
  .link { background: none; border: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; min-height: 40px; }

  .lead { color: var(--ink-soft); margin: 0 0 14px; max-width: 46ch; }
  .modes { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 560px) { .modes { grid-template-columns: 1fr 1fr; } }
  .mode { width: 100%; text-align: start; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
    background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--ink); }
  .mode:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .mode .tag { grid-row: span 2; font-family: var(--hand); font-size: 24px; background: var(--hi); color: var(--hi-ink); min-width: 62px; min-height: 46px; display: grid; place-items: center; padding: 6px 8px; border: 2px solid var(--ink); border-radius: 4px; direction: ltr; }
  .mode .tag svg { width: 30px; height: 30px; }
  .mode b { font-family: var(--display); font-size: 21px; font-weight: 400; }
  .mode small { color: var(--ink-soft); font-size: 14px; line-height: 1.35; }

  .welcome > h2:first-child { font-size: 32px; margin-top: 10px; }
  .focus { display: flex; align-items: center; gap: 10px; margin: 18px 0 6px; font-weight: 600; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 10px 14px; }
  .focus input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

  h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 26px 0 10px; }
  .chips { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .chip { background: var(--card); border: 2px solid var(--ink); border-radius: 4px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
  .chip { flex-wrap: wrap; }
  .chip .en { font-family: var(--hand); font-size: 22px; direction: ltr; overflow-wrap: break-word; }
  .dots { display: flex; gap: 3px; direction: ltr; flex: none; }
  .dots i { width: 9px; height: 9px; border: 1.5px solid var(--ink); border-radius: 50%; display: block; }
  .dots i.on { background: var(--good); border-color: var(--good); }
  .legend { color: var(--ink-soft); font-size: 14px; margin-top: 8px; }

  .panel { background: transparent; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink-soft); font-weight: 600; margin-bottom: 10px; flex-wrap: wrap; }
  .bar { height: 10px; border: 2px solid var(--ink); border-radius: 4px; background: var(--card); overflow: hidden; margin-bottom: 16px; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }

  .btn { min-height: 52px; padding: 8px 22px; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); font-weight: 800; font-size: 18px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.good { background: var(--good-bg); color: var(--good); }
  .btn.bad { background: var(--bad-bg); color: var(--bad); }
  .btn.danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); }
  .btn.armed { background: var(--bad); color: var(--card); }
  .btn.wide { width: 100%; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .row .btn { flex: 1 1 150px; max-width: 260px; }
  .say { display: inline-flex; align-items: center; gap: 8px; }
  .say svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .center { display: flex; justify-content: center; margin-top: 14px; }

  .flash { display: block; width: 100%; min-height: 250px; background: var(--card); border: 2px solid var(--ink); border-top: 0; border-radius: 6px; box-shadow: 5px 5px 0 var(--ink);
    padding: 0 16px 20px; text-align: center; position: relative; overflow: hidden; }
  .flash::before { content: ''; display: block; height: 38px; margin-inline: -16px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--margin); }
  .flash .face { display: block; padding-top: 26px; }
  .flash .face .en { font-family: var(--hand); font-size: clamp(44px, 14vw, 68px); direction: ltr; display: inline-block; line-height: 1.1; overflow-wrap: anywhere; }
  .flash .face .he { font-family: var(--display); font-size: clamp(36px, 11vw, 52px); display: inline-block; line-height: 1.2; overflow-wrap: anywhere; }
  .flash.flipped { background: var(--hi); color: var(--hi-ink); }
  .flash .tip { display: block; margin-top: 22px; color: var(--ink-soft); font-size: 14px; }
  .flash.flipped .tip { color: var(--hi-ink); }

  .qbox { background: var(--card); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 5px 5px 0 var(--ink); padding: 22px 16px; text-align: center; margin-bottom: 18px; }
  .qbox .small { color: var(--ink-soft); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .qbox .en { font-family: var(--hand); font-size: clamp(42px, 13vw, 60px); direction: ltr; display: inline-block; line-height: 1.1; overflow-wrap: anywhere; }
  .qbox .he { font-family: var(--display); font-size: clamp(34px, 10vw, 46px); display: inline-block; line-height: 1.2; overflow-wrap: anywhere; }
  .opts { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 520px) { .opts { grid-template-columns: 1fr 1fr; } }
  .opt { min-height: 58px; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); font-size: 20px; font-weight: 600; padding: 8px 12px; min-width: 0; overflow-wrap: anywhere; }
  .opt.en { font-family: var(--hand); font-size: 26px; direction: ltr; }
  .opt.ok { background: var(--good-bg); color: var(--good); border-color: var(--good); box-shadow: 0 4px 0 var(--good); }
  .opt.no { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); }
  .fb { min-height: 30px; margin-top: 14px; text-align: center; font-weight: 800; font-size: 19px; }
  .fb.ok { color: var(--good); } .fb.no { color: var(--bad); }
  .fb .en { font-family: var(--hand); font-size: 26px; direction: ltr; display: inline-block; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .mcard { aspect-ratio: 1 / 1.05; max-width: 100%; min-width: 0; background: var(--ink); color: var(--paper); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); padding: 4px;
    display: grid; place-items: center; font-family: var(--display); font-size: 26px; }
  .mcard .f { display: none; }
  .mcard.up { background: var(--card); color: var(--ink); }
  .mcard.up .b { display: none; }
  .mcard.up .f { display: block; }
  .mcard.done { background: var(--good-bg); color: var(--good); border-color: var(--good); box-shadow: 0 4px 0 var(--good); }
  .mcard .f.en { font-family: var(--hand); font-size: clamp(18px, 5.6vw, 28px); direction: ltr; overflow-wrap: anywhere; line-height: 1.1; }
  .mcard .f.he { font-size: clamp(15px, 4.6vw, 22px); line-height: 1.15; overflow-wrap: anywhere; }

  .slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; direction: ltr; margin: 6px 0 18px; }
  .slot { width: 40px; height: 54px; border-bottom: 3px solid var(--ink); font-family: var(--hand); font-size: 34px; text-align: center; line-height: 54px; background: var(--card); }
  .slot.gap { width: 18px; border: 0; background: none; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: ltr; }
  .tile { width: 52px; height: 56px; background: var(--hi); color: var(--hi-ink); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 0 4px 0 var(--ink); font-family: var(--hand); font-size: 32px; padding: 0; }
  .tile.used { visibility: hidden; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

  .answer { width: 100%; min-height: 60px; direction: ltr; text-align: center; font-family: var(--hand); font-size: 34px; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 6px 12px; }
  .answer.ok { border-color: var(--good); background: var(--good-bg); }
  .answer.no { border-color: var(--bad); background: var(--bad-bg); }

  .done { text-align: center; padding-top: 10px; }
  .stars { font-size: 60px; letter-spacing: 6px; color: var(--hi); -webkit-text-stroke: 2px var(--ink); direction: ltr; line-height: 1.1; }
  .stars .off { color: transparent; }
  .done h2 { font-size: 30px; margin: 8px 0; }
  .done p { margin: 4px 0; color: var(--ink-soft); font-weight: 600; }

  /* Settings */
  .set h2 { margin-top: 28px; }
  .set .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 10px; max-width: 52ch; }
  .skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }
  .skin { width: 100%; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 8px; display: grid; gap: 8px; text-align: start; box-shadow: 0 3px 0 var(--ink); }
  .skin[aria-checked="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
  .skin .sw { display: flex; height: 40px; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .skin .sw i { flex: 1; display: block; }
  .skin .nm { font-weight: 800; }
  .skin[aria-checked="true"] .nm::before { content: '✓ '; color: var(--accent); }
  .stack { display: grid; gap: 12px; }
  .stack .btn { width: 100%; text-align: center; }

  /* Word entry */
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; font-size: 14px; }
  .fi { width: 100%; min-width: 0; min-height: 48px; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; padding: 6px 10px; font-family: var(--ui); font-size: 18px; }
  .fi.en { font-family: var(--hand); font-size: 20px; padding-inline: 8px; direction: ltr; text-align: left; }
  .erow, .ehead { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 6px; align-items: center; }
  .erow { margin-bottom: 8px; }
  .ehead { color: var(--ink-soft); font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .ehead span:nth-child(2) { direction: ltr; text-align: left; }
  .erow.bad .fi { border-color: var(--bad); background: var(--bad-bg); }
  .rn { text-align: center; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 15px; }
  .rx { width: 44px; height: 44px; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; font-size: 22px; line-height: 1; padding: 0; }
  .note { background: var(--hi); color: var(--hi-ink); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; font-weight: 600; }
  .paste { margin: 14px 0 0; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 4px 12px 12px; }
  .paste summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
  textarea.fi { min-height: 120px; resize: vertical; line-height: 1.4; }

  /* Photo */
  .filebtn { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .shot { display: block; max-width: 100%; max-height: 260px; margin: 0 auto 14px; border: 2px solid var(--ink); border-radius: 6px; object-fit: contain; background: var(--card); }
  .status { display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; font-size: 19px; }
  .spin { width: 24px; height: 24px; border: 3px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: sp .9s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .hint { text-align: center; color: var(--ink-soft); font-size: 14px; margin: 8px 0 0; }
  .errbox { background: var(--bad-bg); color: var(--bad); border: 2px solid var(--bad); border-radius: 6px; padding: 10px 14px; font-weight: 600; margin-bottom: 8px; }


  /* Practice sheets */
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 10px; max-width: 52ch; }
  .sheets { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 560px) { .sheets { grid-template-columns: 1fr 1fr; } }
  .sheetcard { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; text-align: start; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 10px 12px; box-shadow: 0 3px 0 var(--ink); min-width: 0; }
  .sheetcard:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .sheetcard .tg { grid-row: span 2; font-family: var(--hand); font-size: 20px; background: var(--hi); color: var(--hi-ink); border: 2px solid var(--ink); border-radius: 4px; min-width: 58px; padding: 6px; text-align: center; direction: ltr; }
  .sheetcard b { font-weight: 800; }
  .sheetcard small { color: var(--ink-soft); font-size: 13px; line-height: 1.3; }
  .pages { display: grid; gap: 22px; margin-top: 18px; }
  .pg { margin: 0; }
  .sheetimg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; border: 2px solid var(--ink); border-radius: 4px; background: #ffffff; box-shadow: 4px 4px 0 var(--ink); -webkit-touch-callout: default; }
  .pg figcaption { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--ink-soft); font-size: 14px; margin-top: 10px; }
  .msg { text-align: center; font-weight: 600; margin: 12px 0 0; min-height: 24px; }
  .msg.ok { color: var(--good); } .msg.no { color: var(--bad); }


  /* Notice + sentences */
  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: rgba(10, 14, 36, 0.62); overflow-y: auto; }
  .dialog { width: 100%; max-width: 460px; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 6px 6px 0 var(--ink); padding: 22px 20px; }
  .dialog h2 { margin: 0 0 12px; font-size: 28px; }
  .dialog p { margin: 0 0 10px; }
  .dialog .stack { margin-top: 16px; }
  .srow { margin-bottom: 14px; }
  .srow label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 800; margin-bottom: 4px; }
  .srow .st { font-weight: 600; font-size: 14px; color: var(--ink-soft); }
  .srow .st.ok { color: var(--good); }
  .srow .st.no { color: var(--bad); }
  .srow textarea { min-height: 78px; font-size: 22px; line-height: 1.25; resize: vertical; }
  .srow.bonus textarea { border-style: dashed; }
  .ideas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .ideas li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule); padding: 4px 0; }
  .ideas .en { font-family: var(--hand); font-size: 20px; direction: ltr; }
  .sent h2:first-of-type { margin-top: 6px; }


  .srow input.he { margin-top: 6px; font-size: 19px; }

  /* ---------- 1. Flashcards ---------- */

  /* ---------- 2. Quiz ---------- */

  /* ---------- 4. Build the word ---------- */
  function spell() {

  /* ---------- 5. Dictation ---------- */

            later(function () { i++; next(); }, 2200);
          } else {
            fb.className = 'fb no'; fb.innerHTML = sm() ? 'כמעט. הרמז: המשפט מתחיל במילה ' + en(w.en.split(' ')[0]) + ' ויש בו ' + w.en.split(' ').length + ' מילים' : 'כמעט. הרמז: מתחילה באות ' + en(w.en.charAt(0)) + ', ' + w.en.replace(/ /g, '').length + ' אותיות';
          }
        }
      });
      var hb = document.getElementById('hint');
      if (hb) hb.addEventListener('click', function () { document.getElementById('clue').textContent = w.he; });
      input.focus();
    }
    next();
  }

  /* ---------- start ---------- */
  if (store.dict && store.dict.src === 'lib') {
    var curLib = LIBRARY.filter(function (l) { return l.id === store.dict.id; })[0];
    if (curLib) { store.dict.name = curLib.name; store.dict.type = curLib.type === 'sentences' ? 'sentences' : 'words'; store.dict.words = libWords(curLib); }
  }
  if (LIBRARY.length && store.seenLib !== LIBRARY[0].id) {
    store.seenLib = LIBRARY[0].id;
    if (!store.dict || store.dict.src === 'lib') useLib(LIBRARY[0]);
    save();
  }
  applySkin(store.skin);
  chrome();
  backHome();
})();
</script>
